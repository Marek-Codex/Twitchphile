<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Twitchphile</title>
  <style>
    @font-face { font-family: "Exo 2"; src: url(fonts/exo2.woff2) format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Kode Mono"; src: url(fonts/kodemono.woff2) format("woff2"); font-weight: 500; }
    :root {
      --bg:#0A0D12; --surface:#0F131A; --raised:#141A23; --hover:#19212C; --border:#1C2531; --border-hi:#26344A;
      --t1:#F2F7FF; --t2:#D7E3F4; --t3:#A3B1C6; --t4:#7C8BA1; --t5:#56637A;
      --accent:#3CA0FF; --accent-hi:#6BB8FF; --accent-dim:rgba(60,160,255,.14); --glow:rgba(60,160,255,.35); --live:#EB0400; --mint:#47D7B2;
      --font:"Exo 2",system-ui,sans-serif; --mono:"Kode Mono",ui-monospace,monospace; --fast:.15s ease;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:#F4F7FB; --surface:#FFFFFF; --raised:#EAF0F8; --hover:#E6EDF6; --border:#D8E1EC; --border-hi:#C3D0E1;
        --t1:#0B1320; --t2:#243247; --t3:#45566E; --t4:#5F7089; --t5:#8593A8;
        --accent:#1F86EB; --accent-hi:#1467C4; --accent-dim:rgba(31,134,235,.12); --glow:rgba(31,134,235,.28);
      }
      .primary { color: #FFFFFF !important; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    body { width: 360px; background: var(--bg); color: var(--t2); font: 13px/1.4 var(--font); }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 16px 16px; }

    header { position: relative; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px 0 16px;
      border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(60,160,255,.09), transparent); }
    .mark { font-weight: 700; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--t1); }
    .mark b { color: var(--accent); font-weight: inherit; }
    .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font: 11px var(--mono); letter-spacing: .08em; color: var(--t4); }
    .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--t5); }
    .status i.on { background: var(--mint); box-shadow: 0 0 6px rgba(71,215,178,.6); }
    .icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--t4); transition: background var(--fast), color var(--fast); }
    .icon:hover { background: var(--hover); color: var(--t1); }
    .ic { display: inline-grid; place-items: center; line-height: 0; }
    .wt .ic { display: inline-block; vertical-align: -1px; }
    .spin .ic { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* The browser caps popups at 600px tall. Only the list may scroll: if the page itself overflowed, its scrollbar
       would steal width from the fixed 360px body and push the right-hand buttons past the edge. The stable gutter
       keeps the star column still when the list's own scrollbar comes and goes. */
    html, body { overflow: hidden; }
    main { position: relative; max-height: 440px; overflow-y: auto; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: var(--border-hi) transparent; }
    ul { list-style: none; padding: 6px; }
    li { position: relative; display: flex; align-items: center; border-radius: 6px; transition: background var(--fast); }
    li:hover { background: var(--hover); }
    li a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px; color: inherit; text-decoration: none; }
    /* Avatars: a mint ring means live (same language as the desktop app). */
    .av { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; padding: 2px; display: grid; place-items: center; }
    .av.live { box-shadow: inset 0 0 0 2px var(--mint); }
    .av img, .av .initial { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--raised); }
    .av .initial { display: grid; place-items: center; color: var(--t3); font-weight: 700; }
    .off-row .av { width: 28px; height: 28px; opacity: .75; }
    .off-row a { padding: 4px 6px; }
    .off-row .name { color: var(--t3); font-weight: 500; }
    .live-row { align-items: flex-start; }
    .live-row .star { margin-top: 6px; }
    .line { display: flex; align-items: baseline; gap: 8px; }
    .line .name { flex: 1; min-width: 0; }
    .sub { color: var(--t5); font: 10.5px var(--mono); }

    .tabs { position: relative; display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--border); }
    .tabs button { display: flex; align-items: center; gap: 6px; padding: 6px 10px 8px; color: var(--t4); font-weight: 600; border-bottom: 2px solid transparent; transition: color var(--fast); }
    .tabs button:hover { color: var(--t2); }
    .tabs button[aria-selected="true"] { color: var(--t1); border-bottom-color: var(--accent); }
    .tabs .n { font: 10px var(--mono); color: var(--t5); }
    .tabs .checked { margin-left: auto; align-self: center; padding-bottom: 2px; font: 9.5px var(--mono); letter-spacing: .08em; color: var(--t5); }
    .sec { padding: 10px 16px 0; font: 10.5px var(--mono); letter-spacing: .1em; color: var(--t4); font-weight: 500; }
    .search { padding: 10px 12px 0; }
    .search input { width: 100%; height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-hi); background: var(--surface); color: var(--t1); font: 12.5px var(--font); }
    .search input:focus { outline: none; border-color: var(--accent); }
    .meta { flex: 1; min-width: 0; }
    .name { color: var(--t1); font-weight: 600; font-size: 13px; }
    .game { color: var(--accent-hi); font-size: 11.5px; }
    .title, .game, .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title { color: var(--t4); font-size: 11.5px; }
    .wt { color: var(--t4); font-family: var(--mono); font-size: 10.5px; }
    .nums { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font: 11px var(--mono); color: var(--t4); }
    .viewers { color: var(--t2); display: flex; align-items: center; gap: 4px; }
    .viewers { font: 11px var(--mono); }
    .viewers::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--mint); }
    .star { width: 28px; height: 28px; margin-right: 4px; display: grid; place-items: center; border-radius: 6px; color: var(--t5); transition: color var(--fast), background var(--fast); }
    .star:hover { color: var(--t2); background: var(--raised); }
    .star.hide { opacity: 0; margin-right: 0; }
    li:hover .star.hide { opacity: 1; }
    .tag { margin-left: 6px; padding: 0 4px; border-radius: 3px; font: 9px var(--mono); letter-spacing: .08em; color: var(--t4); background: var(--raised); vertical-align: 1px; }
    .add-fav { display: block; width: calc(100% - 24px); margin: 0 12px 8px; padding: 8px 10px; border: 1px dashed var(--t4); border-radius: 6px; background: transparent; color: var(--t2); font: inherit; font-size: 12px; text-align: left; cursor: pointer; }
    .add-fav:hover { color: var(--t1); border-color: var(--t2); }
    .tag.kick { color: #0b0e0f; background: #53fc18; }
    .star.on { color: var(--accent); filter: drop-shadow(0 0 4px var(--glow)); }

    .empty { padding: 32px 24px; text-align: center; color: var(--t4); display: grid; gap: 14px; justify-items: center; }
    .primary { height: 34px; padding: 0 16px; border-radius: 6px; background: var(--accent); color: #041018; font-weight: 700; transition: background var(--fast); }
    .primary:hover { background: var(--accent-hi); }
    .primary:disabled { opacity: .6; cursor: default; }

    .ended { border-top: 1px solid var(--border); }
    .ended summary { cursor: pointer; list-style: none; padding: 10px 16px; font: 10.5px var(--mono); letter-spacing: .1em; color: var(--t4); }
    .ended summary:hover { color: var(--t2); }
    .ended ul { padding-top: 0; }
    .ended li a { padding: 4px 8px; }
    .ended .name { font-size: 12px; color: var(--t2); }

    footer { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 12px;
      border-top: 1px solid var(--border); font: 10px var(--mono); letter-spacing: .08em; color: var(--t5); }
    .chip { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--border-hi);
      font: 10.5px var(--mono); letter-spacing: .08em; color: var(--t4); transition: all var(--fast); }
    .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--t5); }
    .chip.on { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-hi); }
    .chip.on i { background: var(--accent-hi); box-shadow: 0 0 6px var(--glow); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
